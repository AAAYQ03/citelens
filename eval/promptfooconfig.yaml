# CiteLens analysis-quality eval.
# Run:  ANTHROPIC_API_KEY=sk-ant-... npx promptfoo@latest eval -c eval/promptfooconfig.yaml
# View: npx promptfoo@latest view
description: CiteLens citation-analysis quality (anchor rate, verbatim rate, stance correctness)

prompts:
  - file://prompts/analyze.js

# Engine x model matrix. Both engines run through the same code the
# extension ships (extension/core/verify.js via providers/engine.js).
providers:
  - id: file://providers/engine.js
    label: "prompt+schema · sonnet-5"
    config: { engine: prompt, model: claude-sonnet-5 }
  - id: file://providers/engine.js
    label: "prompt+schema · haiku-4-5"
    config: { engine: prompt, model: claude-haiku-4-5 }
  - id: file://providers/engine.js
    label: "citations · sonnet-5"
    config: { engine: citations, model: claude-sonnet-5 }
  - id: file://providers/engine.js
    label: "citations · haiku-4-5"
    config: { engine: citations, model: claude-haiku-4-5 }

defaultTest:
  options:
    # grader for llm-rubric assertions
    provider: anthropic:messages:claude-sonnet-5
  assert:
    - type: javascript
      value: file://asserts/quality.js

tests: file://dataset/cases.yaml
