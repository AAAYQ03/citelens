<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CiteLens</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <span class="logo">◎ CiteLens</span>
    <span class="spacer"></span>
    <button id="verifyAllBtn" type="button" class="btn-primary" title="Decompose the newest cited answer and verify every claim">Verify answer</button>
    <button id="settingsBtn" type="button" title="API key settings">⚙</button>
  </header>

  <section id="settings" hidden>
    <label for="keyInput">API Key</label>
    <input id="keyInput" type="password" placeholder="sk-ant-… (stored only in this browser)" />
    <select id="engineSelect" title="Analysis engine">
      <option value="prompt">Prompt engine</option>
      <option value="citations">Citations engine (experimental)</option>
    </select>
    <select id="modelSelect" title="Analysis model">
      <option value="claude-sonnet-5">Sonnet 5 · balanced (~$0.016)</option>
      <option value="claude-opus-5">Opus 5 · deepest, slower (~$0.04)</option>
      <option value="claude-haiku-4-5">Haiku 4.5 · fastest (~$0.008)</option>
    </select>
    <button id="keySave" type="button" class="btn-primary">Save</button>
    <span id="metricsLine" class="hint metrics" hidden></span>
  </section>

  <section id="srcbar" hidden>
    <a id="sourceUrl" target="_blank" rel="noreferrer" title="Open source URL"></a>
    <span id="srcHint" class="hint"></span>
    <button id="openOriginal" type="button" title="Open in new tab">↗</button>
  </section>

  <section id="claimCard" hidden>
    <span class="chip">CLAIM</span>
    <p id="claimText" class="clamped" title="Click to expand"></p>
    <button id="analyzeBtn" type="button" class="btn-primary" title="Why does the source support this claim?">Analyze</button>
  </section>

  <section id="analysisStrip" hidden>
    <span id="stanceFlag" hidden></span>
    <span id="chipRow"></span>
    <span class="spacer"></span>
    <button id="captureBtn" type="button" title="Copy this analysis as an eval case">⤓ case</button>
    <button id="expandBtn" type="button" title="Show reasoning chain">▾ 推导</button>
  </section>

  <section id="reasoningRow" hidden>
    <p id="reasoning"></p>
  </section>

  <section id="status"></section>

  <section id="overview" hidden>
    <p id="ovSummary"></p>
    <div id="ovList"></div>
  </section>

  <div id="viewer">
    <iframe id="frame" hidden sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
    <p id="emptyHint">
      Open a ChatGPT answer that cites sources, then click a
      <span class="inline-btn">◎</span> next to any citation — or hit
      <b>Verify answer</b> above to check the whole reply at once.
    </p>
  </div>

  <script src="../core/verify.js"></script>
  <script src="../vendor/readability.js"></script>
  <script src="../content/annotate.js"></script>
  <script src="panel.js"></script>
</body>
</html>
