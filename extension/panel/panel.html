<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CiteLens</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <span class="logo">◎ CiteLens</span>
    <span id="matchBadge" class="badge" hidden></span>
    <span class="spacer"></span>
    <div class="toggle" id="modeToggle" hidden>
      <button id="modeOriginal" type="button">Original</button>
      <button id="modeReader" type="button">Reader</button>
    </div>
    <button id="settingsBtn" type="button" title="API key settings">⚙</button>
  </header>

  <section id="settings" hidden>
    <input id="keyInput" type="password" placeholder="Anthropic API key (sk-ant-…) — stored only in this browser" />
    <button id="keySave" type="button">Save</button>
  </section>

  <section id="srcbar" hidden>
    <a id="sourceUrl" target="_blank" rel="noreferrer" title="Open source URL"></a>
    <span id="srcHint" class="hint"></span>
    <button id="openOriginal" type="button" title="Open in new tab with highlight">↗</button>
  </section>

  <section id="claimCard" hidden>
    <span class="chip">CLAIM</span>
    <p id="claimText" class="clamped" title="Click to expand"></p>
    <button id="analyzeBtn" type="button" title="Analyze: why does the source support this?">⚡</button>
  </section>

  <section id="analysisStrip" hidden>
    <span id="verdictMini" class="pill"></span>
    <span id="chipRow"></span>
    <span class="spacer"></span>
    <button id="expandBtn" type="button" title="Show full analysis">▾ 详情</button>
  </section>

  <section id="status"></section>

  <div id="viewer">
    <iframe id="frame" hidden sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
    <article id="content" hidden></article>
    <div id="analysisCard" hidden>
      <div class="row">
        <span id="verdict" class="pill"></span>
        <span class="spacer"></span>
        <button id="closeAnalysis" type="button" title="Collapse">✕</button>
      </div>
      <p id="reasoning"></p>
      <ul id="evidenceList"></ul>
    </div>
    <p id="emptyHint">
      Open a ChatGPT answer that cites sources, then click a
      <span class="inline-btn">◎</span> button next to any citation.
    </p>
  </div>

  <script src="../vendor/readability.js"></script>
  <script src="panel.js"></script>
</body>
</html>
